# Tests must never open the developer's persistent database.
spring:
  datasource:
    url: jdbc:h2:mem:local-tests;MODE=MySQL
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  sql:
    init:
      mode: never
mydefense:
  collection:
    tutorial-mythic-preview-enabled: true
  battle:
    allow-anonymous-entry-snapshots: true
