name: Balance Sync

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

permissions:
  contents: read

defaults:
  run:
    working-directory: server

jobs:
  check-balance-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: |
            server/*.gradle
            server/gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run balance tool tests
        run: ./gradlew balanceToolTest

      - name: Convert balance Excel to JSON
        run: ./gradlew convertBalance

      - name: Check JSON synchronization
        run: |
          if ! git diff --exit-code -- \
            src/main/resources/balance/generated/game-reward.json \
            src/main/resources/balance/generated/alien-upgrade.json
          then
            echo "::error::Balance JSON is out of sync with balance-data.xlsx."
            echo "::error::Linux/macOS: cd server && ./gradlew convertBalance"
            echo "::error::Windows: cd server; .\gradlew convertBalance"
            echo "::error::Commit balance-data.xlsx and both generated JSON files."
            exit 1
          fi

      - name: Run server tests
        run: ./gradlew test
